name: Check SonarNet web availability

on:
  workflow_dispatch:
    inputs:
      evidence:
        description: Verify the Chặng 1 evidence page and report control
        type: boolean
        default: false
      recall:
        description: Verify the public recall page and its JSON downloads
        type: boolean
        default: false
  schedule:
    # UTC. Three-hour spacing leaves room for delayed checks before app hibernation.
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: sonarnet-web-health
  cancel-in-progress: false

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check_web_awake.py
            /tests/test_web_awake.py
            /reports/final/vietnam_rtc_transfer_20261119/summary.json
            /reports/final/vietnam_rtc_transfer_20261119/rank_fusion/results.json
            /reports/final/vietnam_rtc_transfer_20261119/rank_fusion/ais-holdout/results.json
            /reports/final/export_verification/sample_evidence.zip
            /output/pdf/SonarNet_Bao_cao_Chang1_20261120.pdf
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test health and wake-up logic
        run: python -m unittest discover -s tests -p test_web_awake.py -v
      - name: Install browser checker only
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Open app, wake if needed, and verify rendered UI
        env:
          CHECK_EVIDENCE: ${{ inputs.evidence || 'false' }}
          CHECK_RECALL: ${{ inputs.recall || 'false' }}
        run: |
          args=()
          if [ "$CHECK_RECALL" = true ]; then
            args+=(--recall)
          elif [ "$CHECK_EVIDENCE" = true ]; then
            args+=(--evidence)
          else
            args+=(--submission)
          fi
          python scripts/check_web_awake.py "${args[@]}"
      - name: Save browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-health-${{ github.run_id }}
          path: artifacts/web-health/
          retention-days: 7
          if-no-files-found: warn
