name: Check SonarNet web availability

on:
  workflow_dispatch:
  schedule:
    # UTC; avoid the busiest start of the hour. Vietnam: 01:17, 07:17, 13:17, 19:17.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: sonarnet-web-health
  cancel-in-progress: false

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check_web_awake.py
            /tests/test_web_awake.py
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test health and wake-up logic
        run: python -m unittest discover -s tests -p test_web_awake.py -v
      - name: Install browser checker only
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Open app, wake if needed, and verify rendered UI
        run: python scripts/check_web_awake.py
      - name: Save browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-health-${{ github.run_id }}
          path: artifacts/web-health/
          retention-days: 7
          if-no-files-found: warn
