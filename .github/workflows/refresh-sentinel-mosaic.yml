name: Refresh Sentinel-1 Vietnam mosaic

on:
  workflow_dispatch:
    inputs:
      max_updates:
        description: 'Maximum updated cells (0 = until time budget)'
        default: '0'
        required: false
      force_probe:
        description: 'Recheck source access before cooldown expires'
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sentinel-asset-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the data client and CPU inference runtime
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt 'ultralytics>=8.3,<9' 'rasterio>=1.4,<2'
      - name: Refresh Vietnam with bounded source fallback
        env:
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
          MAX_UPDATES: ${{ inputs.max_updates || '0' }}
          FORCE_PROBE: ${{ inputs.force_probe || 'false' }}
        run: |
          args=(--time-budget-seconds 2700 --max-updates "$MAX_UPDATES")
          if [ "$FORCE_PROBE" = true ]; then args+=(--force-probe); fi
          python scripts/run_satellite_refresh.py "${args[@]}"
      - name: Stage changed assets and checkpoint only
        id: assets
        if: ${{ !cancelled() }}
        run: |
          git add assets/sentinel1_vietnam_latest.png assets/sentinel1_vietnam_latest.json assets/sentinel1_global assets/real_scan assets/gfw_global_ship_detections_latest.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'paths<<CHANGED_PATHS' >> "$GITHUB_OUTPUT"
            git diff --cached --name-only --diff-filter=ACMR >> "$GITHUB_OUTPUT"
            echo 'CHANGED_PATHS' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve processed observations if publication fails
        if: ${{ !cancelled() && steps.assets.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-observations-${{ github.run_id }}
          path: ${{ steps.assets.outputs.paths }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Publish a verified asset only when it changed
        if: ${{ !cancelled() && steps.assets.outputs.changed == 'true' }}
        run: |
          git config user.name "sonarnet-vn-bot"
          git config user.email "sonarnet-vn-bot@users.noreply.github.com"
          git commit -m "Refresh verified Vietnam observations and source status"
          git pull --rebase origin main
          git push
