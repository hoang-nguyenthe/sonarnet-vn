name: Refresh Sentinel-1 Vietnam mosaic

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sentinel-asset-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the data client and YOLO runtime
        run: pip install -r requirements.txt "ultralytics>=8.3,<9" "torch>=2.0,<3"
      - name: Render the newest nationwide Sentinel-1 mosaic
        if: ${{ !cancelled() }}
        env:
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
        run: python scripts/refresh_sentinel_mosaic.py
      - name: Render multi-pass global Sentinel-1 sea mosaic
        if: ${{ !cancelled() }}
        env:
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
        run: python scripts/refresh_global_sentinel_tiles.py
      - name: Refresh and detect on detailed SAR cells
        if: ${{ !cancelled() }}
        env:
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
        run: python scripts/refresh_detailed_scan.py --all-pending --region vietnam --time-budget-seconds 1200
      - name: Refresh global GFW SAR detection grid
        if: ${{ !cancelled() }}
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: python scripts/refresh_global_ship_detections.py
      - name: Prepare cached map images before publication
        if: ${{ !cancelled() }}
        run: python scripts/prepare_map_displays.py
      - name: Preserve processed observations if publication fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-observations-${{ github.run_id }}
          path: |
            assets/real_scan/report.json
            assets/real_scan/coverage.json
            assets/real_scan/published/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Publish a verified asset only when it changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "sonarnet-vn-bot"
          git config user.email "sonarnet-vn-bot@users.noreply.github.com"
          git add assets/sentinel1_vietnam_latest.png assets/sentinel1_vietnam_latest.json assets/sentinel1_global assets/real_scan assets/gfw_global_ship_detections_latest.json
          git diff --cached --quiet || git commit -m "Refresh Sentinel-1 Vietnam mosaic"
          git pull --rebase origin main
          git push
