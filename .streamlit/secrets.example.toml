# Copy this file to .streamlit/secrets.toml locally, then replace placeholders.
# For Streamlit Community Cloud, enter the same values in App settings → Secrets.
# Never commit .streamlit/secrets.toml.

[copernicus]
client_id = "sh-your-client-id"
client_secret = "your-client-secret"

# Optional: enables the Global Fishing Watch external-reference layer once it
# is implemented with the account's approved API access.
[gfw]
api_token = "your-gfw-api-token"
